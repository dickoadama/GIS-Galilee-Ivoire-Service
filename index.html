<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2342" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GIS Ivoire" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>GIS — Galilée Ivoire Service | Quincaillerie & Vente de Boissons</title>
    <meta name="description" content="Refonte graphique et vitrine interactive de l'affiche Galilée Ivoire Service : Quincaillerie et Vente de Boissons." />
    <meta property="og:title" content="GIS — Galilée Ivoire Service | Quincaillerie & Vente de Boissons" />
    <meta property="og:description" content="Votre partenaire de confiance ! Tout pour vos travaux et vos projets, et rafraîchissement garanti." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showLaunchHelp() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:48px auto;padding:24px;border:1px solid #cbd5e1;border-radius:12px;background:#ffffff;color:#0f172a;line-height:1.6;box-shadow:0 4px 16px rgba(15,23,42,0.06)">' +
            '<h2 style="margin:0 0 10px;color:#0f2342;font-size:20px">GIS — Galilée Ivoire Service</h2>' +
            '<p style="margin:0 0 12px;font-size:14px;color:#334155">Impossible de charger le bundle autonome (<code>./standalone/gis-app.js</code> manquant).</p>' +
            '<pre style="margin:0 0 12px;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:8px;overflow:auto;font-size:13px">npm install\nnpm run dev</pre>' +
            '<p style="margin:0;font-size:14px;color:#475569">Puis ouvrez <strong>http://localhost:3000</strong> dans votre navigateur.</p>' +
            '</div>';
        }

        function loadStandaloneBundle() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0 || window.__gisStandaloneLoaded) return;
          window.__gisStandaloneLoaded = true;

          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './standalone/gis-app.css';
          document.head.appendChild(css);

          var script = document.createElement('script');
          script.src = './standalone/gis-app.js';
          script.onerror = showLaunchHelp;
          document.body.appendChild(script);
        }

        if (window.location.protocol === 'file:') {
          loadStandaloneBundle();
        } else {
          window.setTimeout(loadStandaloneBundle, 1800);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
